services:
  api:
    build: .
    ports: ["127.0.0.1:18080:18080"]
    environment: &runtime
      DATABASE_URL: mysql+pymysql://travelmate:travelmate_local@mysql:3306/travelmate
      CHECKPOINT_URL: mysql://travelmate:travelmate_local@mysql:3306/travelmate
      QDRANT_URL: http://qdrant:6333
      MODEL_MODE: ${MODEL_MODE:-fixture}
      EMBED_MODE: ${EMBED_MODE:-fixture}
      MODEL_API_KEY: ${MODEL_API_KEY:-}
      AUTH_SECRET: ${AUTH_SECRET:-replace-with-a-random-secret-at-least-32-characters}
      ARTIFACT_DIR: /workspace/artifacts
    volumes: ["artifacts:/workspace/artifacts"]
    depends_on:
      mysql: {condition: service_healthy}
      qdrant: {condition: service_started}
  worker:
    build: .
    command: ["python", "-m", "app.worker"]
    environment: *runtime
    volumes: ["artifacts:/workspace/artifacts"]
    depends_on:
      mysql: {condition: service_healthy}
      qdrant: {condition: service_started}
volumes:
  artifacts:
